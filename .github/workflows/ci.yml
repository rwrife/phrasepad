name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PhrasePad.sln

      - name: Build
        run: dotnet build PhrasePad.sln --configuration Release --no-restore --warnaserror

      - name: Run core tests
        run: dotnet test tests/PhrasePad.Core.Tests/PhrasePad.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
