name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PhrasePad.sln

      - name: Build
        run: dotnet build PhrasePad.sln --configuration Release --no-restore --warnaserror

      - name: Run core tests
        run: dotnet test tests/PhrasePad.Core.Tests/PhrasePad.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
